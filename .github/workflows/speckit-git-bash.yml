permissions:
  contents: read

env:
  CT_FUNCTIONS_FILE: ${{ github.workspace }}/devBenches/base-image/files/ct/ct-functions.zsh
  SPECKIT_WORKTREE_FALLBACK_FILE: ${{ github.workspace }}/devBenches/base-image/files/speckit-worktree/templates/specify/shell/worktrees.sh

jobs:
  classify:
    name: Classify helper stack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: read
    outputs:
      skip_helper: ${{ steps.scope.outputs.skip_helper }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Classify from trusted main; uncertainty retains full CI
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 -I scripts/helper-stack-ci.py; then
            echo 'skip_helper=false' >> "$GITHUB_OUTPUT"
          fi

  regression:
    needs: classify
    if: >-
      ${{ always() && !cancelled() &&
      (needs.classify.result != 'success' || needs.classify.outputs.skip_helper != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run shared integration suites
        uses: ./.github/actions/openspeckit-bash

  git-2-34-1:
    needs: classify
    if: >-
      ${{ always() && !cancelled() &&
      (needs.classify.result != 'success' || needs.classify.outputs.skip_helper != 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run shared integration suites
        uses: ./.github/actions/openspeckit-compat
        with:
          runtime: git-2-34-1

  bash-3-2:
    needs: classify
    if: >-
      ${{ always() && !cancelled() &&
      (needs.classify.result != 'success' || needs.classify.outputs.skip_helper != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run shared integration suites
        uses: ./.github/actions/openspeckit-compat
        with:
          runtime: bash-3-2
