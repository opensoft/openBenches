      - docs/claude-multi-account-profiles.md
      - README.md
      - scripts/wave-container-shell.sh
      - setup.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  CT_FUNCTIONS_FILE: ${{ github.workspace }}/devBenches/base-image/files/ct/ct-functions.zsh
  SPECKIT_WORKTREE_FALLBACK_FILE: ${{ github.workspace }}/devBenches/base-image/files/speckit-worktree/templates/specify/shell/worktrees.sh

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run shared integration suites
        uses: ./.github/actions/openspeckit-bash

  git-2-34-1:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run shared integration suites
        uses: ./.github/actions/openspeckit-compat
        with:
          runtime: git-2-34-1

  bash-3-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run shared integration suites
        uses: ./.github/actions/openspeckit-compat
        with:
          runtime: bash-3-2
