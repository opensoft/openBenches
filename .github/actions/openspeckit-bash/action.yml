name: OpenSpeckit Bash integration
description: Preserved ordinary Ubuntu Bash integration suites.
runs:
  using: composite
  steps:
    - name: Ensure zsh is available
      shell: bash
      run: |
        if ! command -v zsh >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
        fi

    - name: Verify runtime prerequisites
      shell: bash
      run: |
        git --version
        bash --version | sed -n '1p'
        python3 --version
        zsh --version

    - name: Check the vendored upstream copies against their pin
      shell: bash
      run: python3 ./devBenches/base-image/update-upstream.py check

    # opensoft/workBenches#153. `apply`'s two ways to accept a commit: the
    # default-branch rule, word for word as it was, and a release named by
    # `--tag` and `--branch`. The real tool runs against a throwaway pin with
    # a stub `gh` first on PATH, a failing `curl`, a bogus GH_TOKEN and an
    # empty GH_CONFIG_DIR, so nothing reaches GitHub. Needs python3, git, jq.
    - name: Run the update-upstream.py apply regression test
      shell: bash
      run: python3 ./devcontainer.test/test-update-upstream.py

    - name: Run the setup-estate-commands regression test
      shell: bash
      run: bash ./devcontainer.test/test-setup-estate-commands.sh

    - name: Run the setup-workspace-repo regression test
      shell: bash
      run: bash ./devcontainer.test/test-setup-workspace-repo.sh

    # opensoft/workBenches#90. Two suites that guard the same estate install
    # from the other end -- the container-start step's wiring, and the
    # launcher's own account of removing the Amendment 12 name guard -- and
    # until this PR nothing in CI ran either, so a regression in either went
    # green. Both are host-run and hermetic: the first reads two Dockerfiles
    # and never builds one, the second redirects HOME, CLAUDE_PROFILES_HOME
    # and the profile manifest into its own sandbox and needs no tmux.
    - name: Run the base-image Dockerfile wiring test
      shell: bash
      run: bash ./devcontainer.test/test-base-image-dockerfile.sh

    # Remaining launcher suites from #105. Fakes and temporary profiles keep
    # these independent of real accounts, tmux servers, and AI sessions.
    - name: Run launcher, lane, and statusline regression suites
      shell: bash
      run: |
        jq --version
        script --version
        for suite in \
          test-claude-profile-lane-default \
          test-claude-profile-lane-start \
          test-claude-profile-session-start-hook \
          test-claude-profile-preserves-model \
          test-claude-tmux-statusline \
          test-claude-tmux-statusline-env-isolation \
          test-claude-statusline-snapshots; do
          bash "./devcontainer.test/$suite.sh"
        done

    - name: Run the claude-profile name-guard regression test
      shell: bash
      run: bash ./devcontainer.test/test-claude-profile-name-guard-hook.sh

    - name: Run the claude-profile binary-selection regression test
      shell: bash
      env:
        WORKBENCHES_CLAUDE_TMUX_CHILD: "1"
        WORKBENCHES_CLAUDE_WINDOW: ambient-lane
        WORKBENCHES_CLAUDE_WINDOW_ID: "@999"
        CLAUDE_LANE: ambient-lane
        # What a session started by the launcher carries (opensoft/workBenches#119).
        CLAUDE_BIN: /ambient/claude
        CLAUDE_RESOLVED_BIN: /ambient/claude
        CLAUDE_VERIFIED_VERSION: "0.0.1"
      run: bash ./devcontainer.test/test-claude-profile-binary-selection.sh

    # lane-collision-protocol Amendment 9 adoption act 4b. This suite is the
    # guard on the act's deletion -- that scripts/setup-claude-profiles.sh no
    # longer installs the /lane-swap skill or ensures the SessionStart entry,
    # and that `openRepoTools --install` is the one thing that does. Until
    # this PR nothing in CI ran it, so restoring either writer would have
    # gone green. It is host-run, needs only bash/jq/python3, and is
    # hermetic: it redirects HOME, CLAUDE_PROFILES_HOME and CLAUDE_USER_DIR
    # into its own sandbox.
    - name: Run the lane-swap skill install regression test
      shell: bash
      run: bash ./devcontainer.test/test-claude-profile-skill-install.sh

    # opensoft/workBenches#93. This suite audits lane-collision-protocol
    # Amendment 11 (the launcher's window reuse, directory and precedence-4
    # rules) plus the vendored handoff/lane-swap skill's mechanics, against
    # `base-image/files/claude-profile`, `base-image/files/claude-usage-
    # guard.sh`, `docs/claude-multi-account-profiles.md` and the vendored
    # openrepotools skills/commands above. It was written but never wired in
    # here, so real rot against the vendored bytes went uncaught for two
    # pin moves; every assertion that had drifted from the shipped bytes
    # without a genuine gap behind it is retargeted in the suite itself
    # (cited inline as `RETARGETED (opensoft/workBenches#93)`), and every
    # assertion behind a real upstream gap is skipped pending its own issue
    # (`KNOWN GAP, NOT THIS PR'S`, opensoft/openRepoTools#79/#98/#99/#100).
    # Host-run, hermetic (its own $TEST_ROOT, real HOME never touched).
    - name: Run the claude-profile Amendment 11 regression test
      shell: bash
      run: bash ./devcontainer.test/test-claude-profile-amendment-11.sh

    # Every profile's settings.json gets CLAUDE_CODE_DISABLE_REFUSAL_FALLBACK=1
    # under `env` (Brett Heap, 2026-10-13: "we do not want the fallback to
    # 4.8"); the shared protocol's Build Tiers preflight reads it back. This
    # suite pins the seeding: a fresh file, an existing `env` kept whole, an
    # explicit "0" preserved. Host-run, hermetic (its own sandbox for HOME,
    # CLAUDE_PROFILES_HOME and the manifest), needs only bash and jq.
    - name: Run the claude-profile refusal-fallback env regression test
      shell: bash
      run: bash ./devcontainer.test/test-claude-profile-refusal-fallback.sh

    # Every profile's settings.json gets the two agent-model-record hook
    # entries, a PostToolUse on the Agent tool and a SubagentStop, when
    # `~/.local/bin/claude-agent-model-record` is installed (Brett Heap,
    # 2026-10-15: "add the posttooluse hook that records the resolved
    # model"); the shared protocol's Build Tiers "Pin and verify" names the
    # record they write. This suite pins the seeding: both entries byte for
    # byte, ensuring twice appends once, an entry already carrying the
    # command and every foreign entry are left as they are, and nothing is
    # written (or removed) where the script is not. Host-run, hermetic (its
    # own sandbox for HOME, CLAUDE_PROFILES_HOME and the manifest), needs
    # only bash and jq.
    - name: Run the claude-profile agent-model-record hook regression test
      shell: bash
      run: bash ./devcontainer.test/test-claude-profile-agent-model-hook.sh

    - name: Run bootstrap suite
      shell: bash
      run: bash ./devBenches/devcontainer.test/test-openspeckit-bootstrap.sh

    - name: Run feature suite
      shell: bash
      run: bash ./devBenches/devcontainer.test/test-speckit-git-feature.sh

    - name: Run compatibility suite
      shell: bash
      run: bash ./devBenches/devcontainer.test/test-speckit-git-compat.sh

    - name: Run ct launcher suite
      shell: bash
      run: bash ./devBenches/devcontainer.test/test-ct-launchers.sh
