name: Stack candidate integration

on:
  push:
    branches: ['mergify/merge-queue/**']
  pull_request:
    paths:
      - .github/workflows/stack-candidate-heavy.yml
      - .mergify.yml
      - scripts/stack-ci.py
      - devcontainer.test/test-stack-ci.py

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  verify:
    name: Verify queue candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      scope: ${{ steps.candidate.outputs.scope }}
    steps:
      - name: Reject unexpected queue events before checkout
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = opensoft/openBenches
          test "$GITHUB_ACTOR" = 'mergify[bot]'
          [[ "$GITHUB_REF" =~ ^refs/heads/mergify/merge-queue/[0-9a-f]{10}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the combined candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stack-ci.py heavy
      - name: Run combined non-release integration
        if: steps.candidate.outputs.scope == 'docs' || steps.candidate.outputs.scope == 'helper'
        run: |
          set -euo pipefail
          bash devBenches/devcontainer.test/test-openspeckit-bootstrap.sh
          bash devBenches/devcontainer.test/test-speckit-git-feature.sh
          bash devBenches/devcontainer.test/test-speckit-git-compat.sh

  project:
    name: Project stack integration (${{ matrix.os }})
    needs: verify
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' ||
      (needs.verify.result == 'success' && needs.verify.outputs.scope == 'project')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install Bash 4+ for fixture coverage
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "WORKBENCHES_TEST_BASH=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"
      - name: Verify the exact revision and run the full project fixture suite
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Project integration revision: %s\n' "$GITHUB_SHA"
          bash -n scripts/project
          python3 devcontainer.test/test-project-command.py

  gate:
    name: ${{ github.event_name == 'push' && 'openbenches-stack-heavy' || 'Project config aggregate' }}
    needs: [verify, project]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the full expected result
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ needs.verify.outputs.scope }}
          VERIFIED: ${{ needs.verify.result }}
          PROJECT: ${{ needs.project.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            test "$PROJECT" = success
            exit
          fi
          test "$EVENT" = push
          test "$VERIFIED" = success
          case "$SCOPE" in
            docs|helper) test "$PROJECT" = skipped ;;
            project) test "$PROJECT" = success ;;
            *) exit 1 ;;
          esac
