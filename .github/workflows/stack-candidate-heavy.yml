name: Stack candidate integration

on:
  push:
    branches: ['mergify/merge-queue/**']
  pull_request:
    paths:
      - .github/workflows/stack-candidate-heavy.yml
      - .mergify.yml
      - scripts/stack-ci.py
      - devcontainer.test/test-stack-ci.py
      - scripts/project-stack-ci.py
      - devcontainer.test/test-project-stack-ci.py
      - scripts/helper-stack-ci.py
      - devcontainer.test/test-helper-stack-ci.py
      - .github/workflows/project-command.yml
      - .github/workflows/stack-pr-fast.yml
      - .github/workflows/speckit-git-bash.yml
      - .github/workflows/speckit-git-powershell.yml
      - .github/actions/openspeckit-*/**
      - devcontainer.test/helper-integration-baseline.json
      - devcontainer.test/test-helper-coverage-parity.py

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  verify:
    name: Verify queue candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      scope: ${{ steps.candidate.outputs.scope }}
    steps:
      - name: Reject unexpected queue events before checkout
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = opensoft/openBenches
          test "$GITHUB_ACTOR" = 'mergify[bot]'
          [[ "$GITHUB_REF" =~ ^refs/heads/mergify/merge-queue/[0-9a-f]{10}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the combined candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stack-ci.py heavy
      - name: Run combined non-release integration
        if: steps.candidate.outputs.scope == 'docs'
        run: |
          set -euo pipefail
          bash devBenches/devcontainer.test/test-openspeckit-bootstrap.sh
          bash devBenches/devcontainer.test/test-speckit-git-feature.sh
          bash devBenches/devcontainer.test/test-speckit-git-compat.sh

  helper-regression:
    name: Helper full Bash regression
    needs: verify
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' ||
      (needs.verify.result == 'success' && needs.verify.outputs.scope == 'helper')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CT_FUNCTIONS_FILE: ${{ github.workspace }}/devBenches/base-image/files/ct/ct-functions.zsh
      SPECKIT_WORKTREE_FALLBACK_FILE: ${{ github.workspace }}/devBenches/base-image/files/speckit-worktree/templates/specify/shell/worktrees.sh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact integration revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Helper integration revision: %s\n' "$GITHUB_SHA"
      - name: Run preserved integration suites
        uses: ./.github/actions/openspeckit-bash

  helper-git-2-34-1:
    name: Helper Git 2.34.1 compatibility
    needs: verify
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' ||
      (needs.verify.result == 'success' && needs.verify.outputs.scope == 'helper')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact integration revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Helper integration revision: %s\n' "$GITHUB_SHA"
      - name: Run preserved integration suites
        uses: ./.github/actions/openspeckit-compat
        with:
          runtime: git-2-34-1

  helper-bash-3-2:
    name: Helper Bash 3.2 compatibility
    needs: verify
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' ||
      (needs.verify.result == 'success' && needs.verify.outputs.scope == 'helper')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact integration revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Helper integration revision: %s\n' "$GITHUB_SHA"
      - name: Run preserved integration suites
        uses: ./.github/actions/openspeckit-compat
        with:
          runtime: bash-3-2

  helper-powershell-linux:
    name: Helper PowerShell Linux
    needs: verify
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' ||
      (needs.verify.result == 'success' && needs.verify.outputs.scope == 'helper')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact integration revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Helper integration revision: %s\n' "$GITHUB_SHA"
      - name: Run preserved integration suites
        uses: ./.github/actions/openspeckit-powershell

  helper-powershell-windows:
    name: Helper PowerShell Windows
    needs: verify
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' ||
      (needs.verify.result == 'success' && needs.verify.outputs.scope == 'helper')) }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact integration revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Helper integration revision: %s\n' "$GITHUB_SHA"
      - name: Run preserved integration suites
        uses: ./.github/actions/openspeckit-powershell

  project:
    name: Project stack integration (${{ matrix.os }})
    needs: verify
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' ||
      (needs.verify.result == 'success' && needs.verify.outputs.scope == 'project')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install Bash 4+ for fixture coverage
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "WORKBENCHES_TEST_BASH=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"
      - name: Verify the exact revision and run the full project fixture suite
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Project integration revision: %s\n' "$GITHUB_SHA"
          bash -n scripts/project scripts/onp scripts/new-project.sh scripts/install-workbench-commands.sh scripts/setup-workbenches.sh setup.sh
          python3 devcontainer.test/test-project-command.py

  wave-widget-sync:
    name: Wave widget sync integration (${{ matrix.os }})
    needs: verify
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' ||
      (needs.verify.result == 'success' && needs.verify.outputs.scope == 'wave-widget-sync')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Verify the exact revision and run the full Wave widget fixture suite
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Wave widget sync integration revision: %s\n' "$GITHUB_SHA"
          bash -n scripts/sync-wave-widgets.sh
          python3 devcontainer.test/test-wave-widget-sync.py

  gate:
    name: ${{ github.event_name == 'push' && 'openbenches-stack-heavy' || 'Stack config aggregate' }}
    needs: [verify, helper-regression, helper-git-2-34-1, helper-bash-3-2, helper-powershell-linux, helper-powershell-windows, project, wave-widget-sync]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the full expected result
        env:
          SCOPE: ${{ needs.verify.outputs.scope }}
          VERIFIED: ${{ needs.verify.result }}
          PROJECT: ${{ needs.project.result }}
          WAVE_WIDGET_SYNC: ${{ needs.wave-widget-sync.result }}
          HELPER_REGRESSION: ${{ needs.helper-regression.result }}
          HELPER_GIT_2_34_1: ${{ needs.helper-git-2-34-1.result }}
          HELPER_BASH_3_2: ${{ needs.helper-bash-3-2.result }}
          HELPER_POWERSHELL_LINUX: ${{ needs.helper-powershell-linux.result }}
          HELPER_POWERSHELL_WINDOWS: ${{ needs.helper-powershell-windows.result }}
        run: |
          python3 devcontainer.test/test-helper-coverage-parity.py
          python3 scripts/stack-ci.py gate
