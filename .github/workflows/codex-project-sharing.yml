name: Codex Project Sharing

on:
  pull_request:
    paths:
      - .github/workflows/codex-project-sharing.yml
      - scripts/codex-project-state.py
      - scripts/codex-desktop.ps1
      - scripts/setup-multi-cli-codex-profiles.ps1
      - devcontainer.test/test-codex-project-state.py
      - devcontainer.test/test-codex-desktop.ps1
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-project-sharing.yml
      - scripts/codex-project-state.py
      - scripts/codex-desktop.ps1
      - scripts/setup-multi-cli-codex-profiles.ps1
      - devcontainer.test/test-codex-project-state.py
      - devcontainer.test/test-codex-desktop.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Account, runtime, and recovery fixtures
        run: python devcontainer.test/test-codex-project-state.py
      - name: Native Windows desktop fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: ./devcontainer.test/test-codex-desktop.ps1 -Python (Get-Command python).Source
